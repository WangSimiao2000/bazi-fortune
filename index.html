<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>称骨算命</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'KaiTi', 'STKaiti', '楷体', serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                radial-gradient(circle, rgba(218,165,32,0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            animation: drift 60s linear infinite;
        }
        @keyframes drift {
            from { transform: translate(0, 0); }
            to { transform: translate(50px, 50px); }
        }
        .container {
            background: linear-gradient(135deg, rgba(26,26,46,0.95) 0%, rgba(22,33,62,0.95) 100%);
            border: 2px solid rgba(218,165,32,0.3);
            border-radius: 15px;
            padding: clamp(20px, 5vw, 40px);
            box-shadow: 0 0 40px rgba(218,165,32,0.2), inset 0 0 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            position: relative;
            backdrop-filter: blur(10px);
        }
        .container::before {
            content: '☯';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(40px, 10vw, 60px);
            opacity: 0.8;
            filter: drop-shadow(0 0 10px rgba(218,165,32,0.5));
        }
        h1 {
            text-align: center;
            color: #daa520;
            margin-bottom: 8px;
            font-size: clamp(24px, 6vw, 36px);
            text-shadow: 0 0 20px rgba(218,165,32,0.5);
            letter-spacing: clamp(4px, 1.5vw, 8px);
        }
        .subtitle {
            text-align: center;
            color: #b8860b;
            font-size: clamp(12px, 2.5vw, 14px);
            margin-bottom: 20px;
            letter-spacing: clamp(2px, 0.5vw, 3px);
        }
        .info {
            background: rgba(218,165,32,0.1);
            border: 1px solid rgba(218,165,32,0.3);
            padding: clamp(12px, 3vw, 15px);
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: clamp(11px, 2.5vw, 13px);
            line-height: 1.8;
            color: #d4af37;
        }
        .mode-switch {
            display: flex;
            flex-wrap: wrap;
            gap: clamp(10px, 3vw, 20px);
            justify-content: center;
            margin-bottom: 20px;
            padding: clamp(10px, 3vw, 15px);
            background: rgba(218,165,32,0.05);
            border-radius: 8px;
        }
        .mode-switch label {
            color: #daa520;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: clamp(12px, 2.5vw, 14px);
        }
        .mode-switch input[type="radio"] {
            width: auto;
            cursor: pointer;
        }
        .form-group {
            margin-bottom: clamp(15px, 3vw, 20px);
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #daa520;
            font-weight: bold;
            font-size: clamp(13px, 2.8vw, 15px);
        }
        input, select {
            width: 100%;
            padding: clamp(10px, 2.5vw, 12px);
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(218,165,32,0.4);
            border-radius: 6px;
            font-size: clamp(13px, 3vw, 15px);
            color: #f0e68c;
            font-family: 'KaiTi', 'STKaiti', '楷体', serif;
            transition: all 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #daa520;
            box-shadow: 0 0 15px rgba(218,165,32,0.3);
            background: rgba(0,0,0,0.5);
        }
        button {
            width: 100%;
            padding: clamp(12px, 3vw, 15px);
            background: linear-gradient(135deg, #b8860b 0%, #daa520 50%, #b8860b 100%);
            color: #1a1a2e;
            border: 2px solid #daa520;
            border-radius: 8px;
            font-size: clamp(15px, 3.5vw, 18px);
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'KaiTi', 'STKaiti', '楷体', serif;
            letter-spacing: clamp(2px, 1vw, 4px);
            box-shadow: 0 5px 20px rgba(218,165,32,0.3);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(218,165,32,0.5);
            background: linear-gradient(135deg, #daa520 0%, #ffd700 50%, #daa520 100%);
        }
        .result {
            margin-top: clamp(20px, 4vw, 30px);
            padding: clamp(15px, 4vw, 25px);
            background: rgba(0,0,0,0.4);
            border: 2px solid rgba(218,165,32,0.4);
            border-radius: 10px;
            display: none;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
        }
        .result.show {
            display: block;
            animation: fadeIn 0.8s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .process {
            background: rgba(218,165,32,0.05);
            border: 1px solid rgba(218,165,32,0.2);
            padding: clamp(12px, 3vw, 18px);
            border-radius: 8px;
            margin-bottom: clamp(15px, 3vw, 20px);
            font-size: clamp(12px, 2.5vw, 14px);
            line-height: 2;
            color: #d4af37;
        }
        .process-title {
            font-weight: bold;
            color: #daa520;
            margin-bottom: 12px;
            font-size: clamp(14px, 3vw, 17px);
            text-align: center;
            letter-spacing: 2px;
        }
        .process-item {
            padding: clamp(6px, 1.5vw, 8px) 0;
            border-bottom: 1px dashed rgba(218,165,32,0.2);
            word-wrap: break-word;
        }
        .process-item:last-child {
            border-bottom: none;
        }
        .process-sum {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 2px solid #daa520;
            font-weight: bold;
            color: #ffd700;
            font-size: clamp(13px, 3vw, 16px);
            text-align: center;
        }
        .weight {
            font-size: clamp(24px, 6vw, 32px);
            color: #ffd700;
            font-weight: bold;
            margin-bottom: clamp(15px, 3vw, 20px);
            text-align: center;
            text-shadow: 0 0 20px rgba(255,215,0,0.5);
            letter-spacing: clamp(2px, 1vw, 4px);
        }
        .poem {
            font-size: clamp(14px, 3.2vw, 17px);
            line-height: 2.2;
            color: #f0e68c;
            text-align: justify;
            text-indent: 2em;
            background: rgba(218,165,32,0.05);
            padding: clamp(15px, 3vw, 20px);
            border-radius: 8px;
            border-left: 4px solid #daa520;
            word-wrap: break-word;
        }
        small {
            color: #b8860b;
            font-size: clamp(10px, 2vw, 12px);
            margin-top: 5px;
            display: block;
        }
        
        @media (max-width: 480px) {
            body { padding: 10px; }
            .container { border-radius: 10px; }
            .container::before { top: -15px; }
            .mode-switch { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>称骨算命</h1>
        <div class="subtitle">— 袁天罡称骨术 —</div>
        <div class="info">
            <strong>✦ 算法说明</strong><br>
            • 阳历自动转换农历日期<br>
            • 精确节气时刻计算<br>
            • 依据袁天罡称骨术推算命理
        </div>
        <div class="mode-switch">
            <label>
                <input type="radio" name="inputMode" value="solar" checked> 阳历模式（自动转换）
            </label>
            <label>
                <input type="radio" name="inputMode" value="manual"> 手动模式（节气月+农历日）
            </label>
        </div>
        <form id="baziForm">
            <div class="form-group">
                <label>性别</label>
                <select id="gender" required>
                    <option value="male">男</option>
                    <option value="female">女</option>
                </select>
            </div>
            
            <!-- 阳历模式 -->
            <div id="solarMode">
                <div class="form-group">
                    <label>出生年份（阳历）</label>
                    <input type="number" id="year" min="1900" max="2100" value="2000">
                </div>
                <div class="form-group">
                    <label>出生月份（阳历）</label>
                    <select id="month">
                        <option value="1">1月</option>
                        <option value="2">2月</option>
                        <option value="3">3月</option>
                        <option value="4">4月</option>
                        <option value="5">5月</option>
                        <option value="6">6月</option>
                        <option value="7">7月</option>
                        <option value="8">8月</option>
                        <option value="9">9月</option>
                        <option value="10">10月</option>
                        <option value="11">11月</option>
                        <option value="12">12月</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>出生日期（阳历）</label>
                    <input type="number" id="day" min="1" max="31" value="1">
                </div>
                <div class="form-group">
                    <label>出生时间</label>
                    <select id="hour">
                        <option value="0">00:00-00:59 (子时)</option>
                        <option value="1">01:00-01:59 (丑时)</option>
                        <option value="2">02:00-02:59 (丑时)</option>
                        <option value="3">03:00-03:59 (寅时)</option>
                        <option value="4">04:00-04:59 (寅时)</option>
                        <option value="5">05:00-05:59 (卯时)</option>
                        <option value="6">06:00-06:59 (卯时)</option>
                        <option value="7">07:00-07:59 (辰时)</option>
                        <option value="8">08:00-08:59 (辰时)</option>
                        <option value="9">09:00-09:59 (巳时)</option>
                        <option value="10">10:00-10:59 (巳时)</option>
                        <option value="11">11:00-11:59 (午时)</option>
                        <option value="12">12:00-12:59 (午时)</option>
                        <option value="13">13:00-13:59 (未时)</option>
                        <option value="14">14:00-14:59 (未时)</option>
                        <option value="15">15:00-15:59 (申时)</option>
                        <option value="16">16:00-16:59 (申时)</option>
                        <option value="17">17:00-17:59 (酉时)</option>
                        <option value="18">18:00-18:59 (酉时)</option>
                        <option value="19">19:00-19:59 (戌时)</option>
                        <option value="20">20:00-20:59 (戌时)</option>
                        <option value="21">21:00-21:59 (亥时)</option>
                        <option value="22">22:00-22:59 (亥时)</option>
                        <option value="23">23:00-23:59 (子时-次日)</option>
                    </select>
                    <small>⚠️ 注意：23:00-23:59算作次日子时</small>
                </div>
            </div>
            
            <!-- 手动模式 -->
            <div id="manualMode" style="display: none;">
                <div class="form-group">
                    <label>出生年份</label>
                    <input type="number" id="manualYear" min="1900" max="2100" value="2000">
                </div>
                <div class="form-group">
                    <label>节气月</label>
                    <select id="solarMonth">
                        <option value="1">正月（立春后）</option>
                        <option value="2">二月（惊蛰后）</option>
                        <option value="3">三月（清明后）</option>
                        <option value="4">四月（立夏后）</option>
                        <option value="5">五月（芒种后）</option>
                        <option value="6">六月（小暑后）</option>
                        <option value="7">七月（立秋后）</option>
                        <option value="8">八月（白露后）</option>
                        <option value="9">九月（寒露后）</option>
                        <option value="10">十月（立冬后）</option>
                        <option value="11">十一月（大雪后）</option>
                        <option value="12">十二月（小寒后）</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>农历日期</label>
                    <select id="lunarDay">
                        <option value="1">初一</option>
                        <option value="2">初二</option>
                        <option value="3">初三</option>
                        <option value="4">初四</option>
                        <option value="5">初五</option>
                        <option value="6">初六</option>
                        <option value="7">初七</option>
                        <option value="8">初八</option>
                        <option value="9">初九</option>
                        <option value="10">初十</option>
                        <option value="11">十一</option>
                        <option value="12">十二</option>
                        <option value="13">十三</option>
                        <option value="14">十四</option>
                        <option value="15">十五</option>
                        <option value="16">十六</option>
                        <option value="17">十七</option>
                        <option value="18">十八</option>
                        <option value="19">十九</option>
                        <option value="20">二十</option>
                        <option value="21">廿一</option>
                        <option value="22">廿二</option>
                        <option value="23">廿三</option>
                        <option value="24">廿四</option>
                        <option value="25">廿五</option>
                        <option value="26">廿六</option>
                        <option value="27">廿七</option>
                        <option value="28">廿八</option>
                        <option value="29">廿九</option>
                        <option value="30">三十</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>时辰</label>
                    <select id="shiChen">
                        <option value="0">子时（23:00-01:00）</option>
                        <option value="1">丑时（01:00-03:00）</option>
                        <option value="3">寅时（03:00-05:00）</option>
                        <option value="5">卯时（05:00-07:00）</option>
                        <option value="7">辰时（07:00-09:00）</option>
                        <option value="9">巳时（09:00-11:00）</option>
                        <option value="11">午时（11:00-13:00）</option>
                        <option value="13">未时（13:00-15:00）</option>
                        <option value="15">申时（15:00-17:00）</option>
                        <option value="17">酉时（17:00-19:00）</option>
                        <option value="19">戌时（19:00-21:00）</option>
                        <option value="21">亥时（21:00-23:00）</option>
                    </select>
                </div>
            </div>
            <button type="submit">✦ 测算命理 ✦</button>
        </form>
        <div id="result" class="result">
            <div class="process">
                <div class="process-title">✦ 推算过程 ✦</div>
                <div id="processDisplay"></div>
            </div>
            <div class="weight" id="weightDisplay"></div>
            <div class="poem" id="poemDisplay"></div>
        </div>
    </div>

    <script src="bazi-data.js"></script>
    <script src="bazi-poems.js"></script>
    <script src="bazi.js"></script>
</body>
</html>
