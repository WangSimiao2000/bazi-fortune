<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>称骨算命</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-wrapper">
        <div class="container">
            <h1>称骨算命</h1>
            <div class="subtitle">袁天罡称骨术</div>
            <div class="info">
                <strong>算法说明</strong><br>
                • 阳历自动转换农历（1900-2100 年）<br>
                • 节气按太阳黄经计算到分钟<br>
                • 依据袁天罡称骨术推算命理<br>
                • 时间一律按北京时间；1986-1991 年夏令时期间出生的，请先把钟点减 1 小时
            </div>
        <div class="mode-switch">
            <label>
                <input type="radio" name="inputMode" value="solar" checked> 阳历自动换算
            </label>
            <label>
                <input type="radio" name="inputMode" value="manual"> 手动填写
            </label>
        </div>
        <form id="baziForm">
            <div class="form-group">
                <label>性别</label>
                <select id="gender" required>
                    <option value="male">男</option>
                    <option value="female">女</option>
                </select>
            </div>
            
            <!-- 阳历模式 -->
            <div id="solarMode">
                <div class="form-group">
                    <label>计算口径</label>
                    <div class="mode-switch basis-switch">
                        <label><input type="radio" name="basis" value="lunar" checked> 农历（主流）</label>
                        <label><input type="radio" name="basis" value="solar"> 节气（八字）</label>
                    </div>
                    <small>农历：年按春节、月按农历月，闰月按本月。节气：年按立春、月按节气，和八字排盘一致。</small>
                </div>
                <div class="form-group">
                    <label>出生年份（阳历）</label>
                    <input type="number" id="year" min="1900" max="2100" required value="2000">
                </div>
                <div class="form-group">
                    <label>出生月份（阳历）</label>
                    <select id="month">
                        <option value="1">1月</option>
                        <option value="2">2月</option>
                        <option value="3">3月</option>
                        <option value="4">4月</option>
                        <option value="5">5月</option>
                        <option value="6">6月</option>
                        <option value="7">7月</option>
                        <option value="8">8月</option>
                        <option value="9">9月</option>
                        <option value="10">10月</option>
                        <option value="11">11月</option>
                        <option value="12">12月</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>出生日期（阳历）</label>
                    <input type="number" id="day" min="1" max="31" value="1">
                </div>
                <div class="form-group">
                    <label>出生时间</label>
                    <select id="hour">
                        <option value="0">00:00-00:59 (子时)</option>
                        <option value="1">01:00-02:59 (丑时)</option>
                        <option value="3">03:00-04:59 (寅时)</option>
                        <option value="5">05:00-06:59 (卯时)</option>
                        <option value="7">07:00-08:59 (辰时)</option>
                        <option value="9">09:00-10:59 (巳时)</option>
                        <option value="11">11:00-12:59 (午时)</option>
                        <option value="13">13:00-14:59 (未时)</option>
                        <option value="15">15:00-16:59 (申时)</option>
                        <option value="17">17:00-18:59 (酉时)</option>
                        <option value="19">19:00-20:59 (戌时)</option>
                        <option value="21">21:00-22:59 (亥时)</option>
                        <option value="23">23:00-23:59 (子时-次日)</option>
                    </select>
                    <small>23:00-23:59 算作次日子时</small>
                </div>
            </div>
            
            <!-- 手动模式 -->
            <div id="manualMode" style="display: none;">
                <div class="form-group">
                    <label>出生年份（按所选口径的年份）</label>
                    <input type="number" id="manualYear" min="1900" max="2100" value="2000">
                </div>
                <div class="form-group">
                    <label>月份（农历月或节气月）</label>
                    <select id="solarMonth">
                        <option value="1">正月（节气：立春后）</option>
                        <option value="2">二月（节气：惊蛰后）</option>
                        <option value="3">三月（节气：清明后）</option>
                        <option value="4">四月（节气：立夏后）</option>
                        <option value="5">五月（节气：芒种后）</option>
                        <option value="6">六月（节气：小暑后）</option>
                        <option value="7">七月（节气：立秋后）</option>
                        <option value="8">八月（节气：白露后）</option>
                        <option value="9">九月（节气：寒露后）</option>
                        <option value="10">十月（节气：立冬后）</option>
                        <option value="11">冬月（节气：大雪后）</option>
                        <option value="12">腊月（节气：小寒后）</option>
                    </select>
                </div>
                <div class="form-group">
                    <span class="field-label" id="lunarDayLabel">农历日期</span>
                    <div class="day-grid" role="radiogroup" aria-labelledby="lunarDayLabel">
                        <label><input type="radio" name="lunarDay" value="1" checked><span>初一</span></label>
                        <label><input type="radio" name="lunarDay" value="2"><span>初二</span></label>
                        <label><input type="radio" name="lunarDay" value="3"><span>初三</span></label>
                        <label><input type="radio" name="lunarDay" value="4"><span>初四</span></label>
                        <label><input type="radio" name="lunarDay" value="5"><span>初五</span></label>
                        <label><input type="radio" name="lunarDay" value="6"><span>初六</span></label>
                        <label><input type="radio" name="lunarDay" value="7"><span>初七</span></label>
                        <label><input type="radio" name="lunarDay" value="8"><span>初八</span></label>
                        <label><input type="radio" name="lunarDay" value="9"><span>初九</span></label>
                        <label><input type="radio" name="lunarDay" value="10"><span>初十</span></label>
                        <label><input type="radio" name="lunarDay" value="11"><span>十一</span></label>
                        <label><input type="radio" name="lunarDay" value="12"><span>十二</span></label>
                        <label><input type="radio" name="lunarDay" value="13"><span>十三</span></label>
                        <label><input type="radio" name="lunarDay" value="14"><span>十四</span></label>
                        <label><input type="radio" name="lunarDay" value="15"><span>十五</span></label>
                        <label><input type="radio" name="lunarDay" value="16"><span>十六</span></label>
                        <label><input type="radio" name="lunarDay" value="17"><span>十七</span></label>
                        <label><input type="radio" name="lunarDay" value="18"><span>十八</span></label>
                        <label><input type="radio" name="lunarDay" value="19"><span>十九</span></label>
                        <label><input type="radio" name="lunarDay" value="20"><span>二十</span></label>
                        <label><input type="radio" name="lunarDay" value="21"><span>廿一</span></label>
                        <label><input type="radio" name="lunarDay" value="22"><span>廿二</span></label>
                        <label><input type="radio" name="lunarDay" value="23"><span>廿三</span></label>
                        <label><input type="radio" name="lunarDay" value="24"><span>廿四</span></label>
                        <label><input type="radio" name="lunarDay" value="25"><span>廿五</span></label>
                        <label><input type="radio" name="lunarDay" value="26"><span>廿六</span></label>
                        <label><input type="radio" name="lunarDay" value="27"><span>廿七</span></label>
                        <label><input type="radio" name="lunarDay" value="28"><span>廿八</span></label>
                        <label><input type="radio" name="lunarDay" value="29"><span>廿九</span></label>
                        <label><input type="radio" name="lunarDay" value="30"><span>三十</span></label>
                    </div>
                </div>
                <div class="form-group">
                    <label>时辰</label>
                    <select id="shiChen">
                        <option value="0">子时（23:00-01:00）</option>
                        <option value="1">丑时（01:00-03:00）</option>
                        <option value="3">寅时（03:00-05:00）</option>
                        <option value="5">卯时（05:00-07:00）</option>
                        <option value="7">辰时（07:00-09:00）</option>
                        <option value="9">巳时（09:00-11:00）</option>
                        <option value="11">午时（11:00-13:00）</option>
                        <option value="13">未时（13:00-15:00）</option>
                        <option value="15">申时（15:00-17:00）</option>
                        <option value="17">酉时（17:00-19:00）</option>
                        <option value="19">戌时（19:00-21:00）</option>
                        <option value="21">亥时（21:00-23:00）</option>
                    </select>
                </div>
            </div>
            <button type="submit">测算命理</button>
        </form>
        <div id="result" class="result">
            <div class="process">
                <div class="process-title">推算过程</div>
                <div id="processDisplay"></div>
            </div>
            <div class="weight" id="weightDisplay"></div>
            <div class="poem" id="poemDisplay"></div>
        </div>
    </div>
    
    <div id="resultContainer" class="result-container">
        <div class="process">
            <div class="process-title">推算过程</div>
            <div id="processDisplaySide"></div>
        </div>
        <div class="weight" id="weightDisplaySide"></div>
        <div class="poem" id="poemDisplaySide"></div>
    </div>
    </div>

    <script src="bazi-core.js"></script>
    <script src="bazi-poems.js"></script>
    <script src="bazi.js"></script>
</body>
</html>
