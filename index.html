<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>称骨算命</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'KaiTi', 'STKaiti', '楷体', serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                radial-gradient(circle, rgba(218,165,32,0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            animation: drift 60s linear infinite;
        }
        @keyframes drift {
            from { transform: translate(0, 0); }
            to { transform: translate(50px, 50px); }
        }
        .container {
            background: linear-gradient(135deg, rgba(26,26,46,0.95) 0%, rgba(22,33,62,0.95) 100%);
            border: 2px solid rgba(218,165,32,0.3);
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 0 40px rgba(218,165,32,0.2), inset 0 0 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            position: relative;
            backdrop-filter: blur(10px);
        }
        .container::before {
            content: '☯';
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 60px;
            opacity: 0.8;
            filter: drop-shadow(0 0 10px rgba(218,165,32,0.5));
        }
        h1 {
            text-align: center;
            color: #daa520;
            margin-bottom: 10px;
            font-size: 36px;
            text-shadow: 0 0 20px rgba(218,165,32,0.5);
            letter-spacing: 8px;
        }
        .subtitle {
            text-align: center;
            color: #b8860b;
            font-size: 14px;
            margin-bottom: 25px;
            letter-spacing: 3px;
        }
        .info {
            background: rgba(218,165,32,0.1);
            border: 1px solid rgba(218,165,32,0.3);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 13px;
            line-height: 1.8;
            color: #d4af37;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #daa520;
            font-weight: bold;
            font-size: 15px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(218,165,32,0.4);
            border-radius: 6px;
            font-size: 15px;
            color: #f0e68c;
            font-family: 'KaiTi', 'STKaiti', '楷体', serif;
            transition: all 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #daa520;
            box-shadow: 0 0 15px rgba(218,165,32,0.3);
            background: rgba(0,0,0,0.5);
        }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #b8860b 0%, #daa520 50%, #b8860b 100%);
            color: #1a1a2e;
            border: 2px solid #daa520;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'KaiTi', 'STKaiti', '楷体', serif;
            letter-spacing: 4px;
            box-shadow: 0 5px 20px rgba(218,165,32,0.3);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(218,165,32,0.5);
            background: linear-gradient(135deg, #daa520 0%, #ffd700 50%, #daa520 100%);
        }
        .result {
            margin-top: 30px;
            padding: 25px;
            background: rgba(0,0,0,0.4);
            border: 2px solid rgba(218,165,32,0.4);
            border-radius: 10px;
            display: none;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
        }
        .result.show {
            display: block;
            animation: fadeIn 0.8s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .process {
            background: rgba(218,165,32,0.05);
            border: 1px solid rgba(218,165,32,0.2);
            padding: 18px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 2;
            color: #d4af37;
        }
        .process-title {
            font-weight: bold;
            color: #daa520;
            margin-bottom: 12px;
            font-size: 17px;
            text-align: center;
            letter-spacing: 2px;
        }
        .process-item {
            padding: 8px 0;
            border-bottom: 1px dashed rgba(218,165,32,0.2);
        }
        .process-item:last-child {
            border-bottom: none;
        }
        .process-sum {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 2px solid #daa520;
            font-weight: bold;
            color: #ffd700;
            font-size: 16px;
            text-align: center;
        }
        .weight {
            font-size: 32px;
            color: #ffd700;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 0 20px rgba(255,215,0,0.5);
            letter-spacing: 4px;
        }
        .poem {
            font-size: 17px;
            line-height: 2.2;
            color: #f0e68c;
            text-align: justify;
            text-indent: 2em;
            background: rgba(218,165,32,0.05);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #daa520;
        }
        small {
            color: #b8860b;
            font-size: 12px;
            margin-top: 5px;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>称骨算命</h1>
        <div class="subtitle">— 袁天罡称骨术 —</div>
        <div class="info">
            <strong>✦ 算法说明</strong><br>
            • 阳历自动转换农历日期<br>
            • 精确节气时刻计算<br>
            • 依据袁天罡称骨术推算命理
        </div>
        <form id="baziForm">
            <div class="form-group">
                <label>性别</label>
                <select id="gender" required>
                    <option value="male">男</option>
                    <option value="female">女</option>
                </select>
            </div>
            <div class="form-group">
                <label>出生年份（阳历）</label>
                <input type="number" id="year" min="1900" max="2100" value="2000" required>
            </div>
            <div class="form-group">
                <label>出生月份（阳历）</label>
                <select id="month" required>
                    <option value="1">1月</option>
                    <option value="2">2月</option>
                    <option value="3">3月</option>
                    <option value="4">4月</option>
                    <option value="5">5月</option>
                    <option value="6">6月</option>
                    <option value="7">7月</option>
                    <option value="8">8月</option>
                    <option value="9">9月</option>
                    <option value="10">10月</option>
                    <option value="11">11月</option>
                    <option value="12">12月</option>
                </select>
            </div>
            <div class="form-group">
                <label>出生日期（阳历）</label>
                <input type="number" id="day" min="1" max="31" value="1" required>
            </div>
            <div class="form-group">
                <label>出生时间</label>
                <select id="hour" required>
                    <option value="0">00:00-00:59 (子时)</option>
                    <option value="1">01:00-01:59 (丑时)</option>
                    <option value="2">02:00-02:59 (丑时)</option>
                    <option value="3">03:00-03:59 (寅时)</option>
                    <option value="4">04:00-04:59 (寅时)</option>
                    <option value="5">05:00-05:59 (卯时)</option>
                    <option value="6">06:00-06:59 (卯时)</option>
                    <option value="7">07:00-07:59 (辰时)</option>
                    <option value="8">08:00-08:59 (辰时)</option>
                    <option value="9">09:00-09:59 (巳时)</option>
                    <option value="10">10:00-10:59 (巳时)</option>
                    <option value="11">11:00-11:59 (午时)</option>
                    <option value="12">12:00-12:59 (午时)</option>
                    <option value="13">13:00-13:59 (未时)</option>
                    <option value="14">14:00-14:59 (未时)</option>
                    <option value="15">15:00-15:59 (申时)</option>
                    <option value="16">16:00-16:59 (申时)</option>
                    <option value="17">17:00-17:59 (酉时)</option>
                    <option value="18">18:00-18:59 (酉时)</option>
                    <option value="19">19:00-19:59 (戌时)</option>
                    <option value="20">20:00-20:59 (戌时)</option>
                    <option value="21">21:00-21:59 (亥时)</option>
                    <option value="22">22:00-22:59 (亥时)</option>
                    <option value="23">23:00-23:59 (子时-次日)</option>
                </select>
                <small>⚠️ 注意：23:00-23:59算作次日子时</small>
            </div>
            <button type="submit">✦ 测算命理 ✦</button>
        </form>
        <div id="result" class="result">
            <div class="process">
                <div class="process-title">✦ 推算过程 ✦</div>
                <div id="processDisplay"></div>
            </div>
            <div class="weight" id="weightDisplay"></div>
            <div class="poem" id="poemDisplay"></div>
        </div>
    </div>

    <script src="bazi-data.js"></script>
    <script src="bazi-poems.js"></script>
    <script src="bazi.js"></script>
</body>
</html>
